name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "readboard/**"
      - "tests/**"
      - "fixtures/**"
      - "scripts/**"
      - "readboard.sln"
      - "global.json"
      - "NuGet.Config"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  push:
    paths:
      - "readboard/**"
      - "tests/**"
      - "fixtures/**"
      - "scripts/**"
      - "readboard.sln"
      - "global.json"
      - "NuGet.Config"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verification Tests
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.104 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.104"

      - name: Restore solution
        shell: pwsh
        run: dotnet restore readboard.sln --configfile NuGet.Config

      - name: Run verification tests
        shell: pwsh
        run: dotnet test tests/Readboard.VerificationTests/Readboard.VerificationTests.csproj --no-restore

      - name: Install Node dependencies
        shell: pwsh
        run: npm ci

      - name: Run WebView DOM tests
        shell: pwsh
        run: npm run test:webview
