name: WebView2 Host E2E

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.filter.outputs.run_heavy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether host E2E is required
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"; then
            echo "Unable to determine changed files; running host E2E as a safe fallback."
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$changed_files" ]]; then
            echo "No changed files detected; running host E2E as a safe fallback."
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_heavy=false
          while IFS= read -r path; do
            case "$path" in
              docs/*|readme.md|readme_*.md|update-channels.json|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                ;;
              *)
                echo "Relevant change requires host E2E: $path"
                run_heavy=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"

  build:
    name: WebView2 Host E2E Build
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.104 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.104"

      - name: Restore and publish fresh Release application
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $PWD 'artifacts\readboard-publish'
          dotnet restore readboard.sln --configfile NuGet.Config -r win-x64
          dotnet publish readboard/readboard.csproj -c Release -r win-x64 --self-contained true --no-restore --output $publishDirectory
          Copy-Item -LiteralPath (Join-Path $publishDirectory 'runtimes\win-x64\native\WebView2Loader.dll') -Destination (Join-Path $publishDirectory 'WebView2Loader.dll') -Force
          foreach ($relativePath in @('readboard.exe', 'WebView\index.html', 'WebView2Loader.dll')) {
            $path = Join-Path $publishDirectory $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Fresh Release publish did not produce $relativePath."
            }
          }

      - name: Upload fresh Release application
        uses: actions/upload-artifact@v4
        with:
          name: readboard-webview2-e2e-publish
          path: artifacts/readboard-publish
          if-no-files-found: error

  core_run:
    name: WebView2 Host E2E Core Execution
    needs:
      - changes
      - build
    if: needs.changes.outputs.run_heavy == 'true' && needs.build.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.104 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.104"

      - name: Download fresh Release application
        uses: actions/download-artifact@v4
        with:
          name: readboard-webview2-e2e-publish
          path: readboard-publish

      - name: Ensure Evergreen WebView2 Runtime
        shell: pwsh
        run: |
          $clientKey = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $runtimeVersion = (Get-ItemProperty -LiteralPath $clientKey -Name pv -ErrorAction SilentlyContinue).pv
          if ([string]::IsNullOrWhiteSpace($runtimeVersion)) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $installer = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($installer.ExitCode -ne 0) {
              throw "Evergreen WebView2 bootstrapper failed with exit code $($installer.ExitCode)."
            }
            $runtimeVersion = (Get-ItemProperty -LiteralPath $clientKey -Name pv -ErrorAction SilentlyContinue).pv
          }
          if ([string]::IsNullOrWhiteSpace($runtimeVersion)) {
            throw 'Evergreen WebView2 Runtime registration pv is unavailable after preparation.'
          }
          "Evergreen WebView2 Runtime pv: $runtimeVersion" | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'webview2-runtime-version.txt')

      - name: Install Node dependencies
        shell: pwsh
        run: npm ci

      - name: Run core real WebView2 host E2E
        shell: pwsh
        env:
          READBOARD_PUBLISH_DIRECTORY: ${{ github.workspace }}\readboard-publish
        run: npm run test:webview:host:core

      - name: Upload core E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webview2-host-e2e-core-diagnostics
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}\webview2-runtime-version.txt
          if-no-files-found: warn

  core:
    name: WebView2 Host E2E Core
    needs:
      - changes
      - build
      - core_run
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Report core E2E result
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_HEAVY: ${{ needs.changes.outputs.run_heavy }}
          BUILD_RESULT: ${{ needs.build.result }}
          CORE_RESULT: ${{ needs.core_run.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed."
            exit 1
          fi

          if [[ "$RUN_HEAVY" != "true" ]]; then
            echo "Only documentation, templates, or update-channel metadata changed; host E2E was intentionally skipped."
            exit 0
          fi

          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "WebView2 host build did not succeed: $BUILD_RESULT"
            exit 1
          fi

          if [[ "$CORE_RESULT" != "success" ]]; then
            echo "WebView2 Host E2E Core execution did not succeed: $CORE_RESULT"
            exit 1
          fi

          echo "WebView2 Host E2E Core execution succeeded."

  extended:
    name: WebView2 Host E2E Extended
    needs:
      - changes
      - build
      - core_run
    if: needs.changes.outputs.run_heavy == 'true' && needs.build.result == 'success' && needs.core_run.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.104 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.104"

      - name: Download fresh Release application
        uses: actions/download-artifact@v4
        with:
          name: readboard-webview2-e2e-publish
          path: readboard-publish

      - name: Ensure Evergreen WebView2 Runtime
        shell: pwsh
        run: |
          $clientKey = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $runtimeVersion = (Get-ItemProperty -LiteralPath $clientKey -Name pv -ErrorAction SilentlyContinue).pv
          if ([string]::IsNullOrWhiteSpace($runtimeVersion)) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $installer = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($installer.ExitCode -ne 0) {
              throw "Evergreen WebView2 bootstrapper failed with exit code $($installer.ExitCode)."
            }
            $runtimeVersion = (Get-ItemProperty -LiteralPath $clientKey -Name pv -ErrorAction SilentlyContinue).pv
          }
          if ([string]::IsNullOrWhiteSpace($runtimeVersion)) {
            throw 'Evergreen WebView2 Runtime registration pv is unavailable after preparation.'
          }
          "Evergreen WebView2 Runtime pv: $runtimeVersion" | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'webview2-runtime-version.txt')

      - name: Install Node dependencies
        shell: pwsh
        run: npm ci

      - name: Run extended real WebView2 host E2E
        shell: pwsh
        env:
          READBOARD_PUBLISH_DIRECTORY: ${{ github.workspace }}\readboard-publish
        run: npm run test:webview:host:extended

      - name: Upload extended E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webview2-host-e2e-extended-diagnostics
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}\webview2-runtime-version.txt
          if-no-files-found: warn
