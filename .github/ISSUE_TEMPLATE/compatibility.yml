name: "Compatibility / Integration 兼容性问题"
description: 报告与客户端或宿主程序的兼容问题
labels:
  - bug
body:
  - type: input
    id: readboard
    attributes:
      label: readboard 版本
      placeholder: "例如 v1.0.0"
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: 宿主程序及版本
      description: 例如 LizzieYzy-Next。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      placeholder: |
        Windows 版本:
        .NET Runtime:
        客户端:
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      placeholder: 请描述通信、识别、落子或启动方面的问题。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
    validations:
      required: false
