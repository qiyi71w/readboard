name: "📚 Documentation / 文档问题"
description: "Report missing or incorrect documentation / 报告文档缺失或错误"
title: "[Docs] "
labels:
  - documentation
body:
  - id: issue
    type: textarea
    attributes:
      label: "Documentation Issue / 文档问题"
      placeholder: "What should be improved? / 哪些地方需要改进？"
    validations:
      required: true

  - id: suggestion
    type: textarea
    attributes:
      label: "Suggested Improvement / 改进建议"
    validations:
      required: false
